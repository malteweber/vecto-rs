[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vectorstore"
version = "0.1.0"
description = "A tiny, fast in-memory vector store with cosine-similarity search, written in Rust."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dev-weber", email = "dev-weber@posteo.de" }]
keywords = ["vector", "vectorstore", "embeddings", "similarity", "cosine", "search", "nearest-neighbor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dev-weber/vectorstore"

# Only needed to run benchmark.py, which compares this store against the
# numpy/sklearn baselines. The extension module itself has no runtime deps.
[dependency-groups]
dev = [
    "numpy>=2.0.2",
    "scikit-learn>=1.6.1",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# Ship the type stub alongside the compiled extension so editors and type
# checkers understand the API.
include = ["vectorstore.pyi"]
